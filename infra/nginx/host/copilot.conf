# Alternative: nginx installed on the host (apt install nginx) instead of the nginx container.
# Install:
#   sudo cp infra/nginx/host/copilot.conf /etc/nginx/sites-available/copilot.conf
#   sudo sed -i 's/copilot.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/copilot.conf
#   sudo ln -s /etc/nginx/sites-available/copilot.conf /etc/nginx/sites-enabled/copilot.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN --redirect --agree-tos -m YOU@EXAMPLE.COM --non-interactive
# certbot adds the listen 443/ssl_certificate lines and the HTTP->HTTPS redirect, and renews through its systemd timer.
# Use it with the base docker-compose.yml only (COMPOSE_FILE=docker-compose.yml) so ports 80/443 stay free.

limit_req_zone $binary_remote_addr zone=copilot_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=copilot_api:10m rate=30r/s;

upstream copilot_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name copilot.example.com;

    server_tokens off;
    client_max_body_size 25m;
    limit_req_status 429;

    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        proxy_pass http://copilot_frontend/api/healthz;
    }

    location ^~ /api/auth/ {
        limit_req zone=copilot_auth burst=20 nodelay;
        proxy_pass http://copilot_frontend;
    }

    location ^~ /api/agent/ {
        limit_req zone=copilot_api burst=30 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://copilot_frontend;
    }

    location ^~ /api/ {
        limit_req zone=copilot_api burst=60 nodelay;
        proxy_pass http://copilot_frontend;
    }

    location / {
        proxy_pass http://copilot_frontend;
    }
}
