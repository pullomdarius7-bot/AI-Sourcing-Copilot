name: ai-sourcing-copilot

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://copilot_app:${APP_DB_PASSWORD:?run ./scripts/init-env.sh first}@db:5432/${POSTGRES_DB:-copilot}
  JWT_SECRET: ${JWT_SECRET:?run ./scripts/init-env.sh first}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?run ./scripts/init-env.sh first}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  EMAIL_FROM: ${EMAIL_FROM:-AI Sourcing Copilot <no-reply@sourcing.local>}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  # Documents & storage (MinIO first, automatic fallback to the shared local volume)
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-auto}
  STORAGE_LOCAL_DIR: /data/uploads
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-copilot-minio}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run ./scripts/init-env.sh first}
  MINIO_BUCKET: ${MINIO_BUCKET:-documents}
  # Virus scanning (built-in checks + ClamAV)
  SCAN_BACKEND: ${SCAN_BACKEND:-both}
  CLAMAV_HOST: clamav
  # Job workers
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
  # Requirement extraction & review
  REQUIRE_SEPARATE_APPROVER: ${REQUIRE_SEPARATE_APPROVER:-true}
  BULK_VERIFY_MIN_CONFIDENCE: ${BULK_VERIFY_MIN_CONFIDENCE:-0.85}
  EXTRACTION_CHUNK_CHARS: ${EXTRACTION_CHUNK_CHARS:-40000}
  # Suppliers, RFQs & comparisons
  RFQ_NUMBER_PREFIX: ${RFQ_NUMBER_PREFIX:-RFQ}
  SUPPLIER_CODE_PREFIX: ${SUPPLIER_CODE_PREFIX:-SUP}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
  ORG_DISPLAY_NAME: ${ORG_DISPLAY_NAME:-}
  COMPARISON_OUTLIER_RATIO: ${COMPARISON_OUTLIER_RATIO:-0.5}
  # AI providers (all optional; order = preference, unconfigured providers are skipped)
  AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-local,anthropic,openai}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}

x-backend-volumes: &backend-volumes
  - uploads:/data/uploads

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-copilot}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-copilot-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./scripts/init-env.sh first}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      <<: *backend-env
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TEST_DB_HOST: db
      TEST_DB_ADMIN_USER: ${POSTGRES_USER:-copilot}
      TEST_DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  mailpit:
  caddy_data:
  uploads:
  minio_data:
  clamav_data:
  ollama_data:
