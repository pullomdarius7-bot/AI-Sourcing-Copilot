name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest -q
        env:
          TEST_DB_HOST: localhost
          TEST_DB_ADMIN_USER: copilot
          TEST_DB_ADMIN_PASSWORD: copilot
          APP_DB_PASSWORD: ci_app_password_0123456789

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/init-env.sh
      - run: docker compose config -q
      - name: Production overlay and scripts are valid
        run: |
          DOMAIN=ci.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring --profile logging config -q
          for f in scripts/*.sh infra/nginx/*.sh; do bash -n "$f"; done
          docker run --rm -e DOMAIN=ci.example.com -e NGINX_CLIENT_MAX_BODY=25m -e NGINX_REGISTER_DEFAULT=1 \
            --add-host frontend:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/infra/nginx/register-allow.conf:/etc/nginx/register-allow.conf:ro" \
            nginx:1.27-alpine sh -c 'mkdir -p /etc/letsencrypt/live/ci.example.com && apk add --no-cache openssl >/dev/null &&
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=ci.example.com -keyout /etc/letsencrypt/live/ci.example.com/privkey.pem -out /etc/letsencrypt/live/ci.example.com/fullchain.pem 2>/dev/null &&
              /docker-entrypoint.sh nginx -t'
      - run: docker compose up -d --build --wait --wait-timeout 900
      - run: ./scripts/smoke.sh
        env:
          METRICS_URL: http://127.0.0.1:8000/metrics
      - name: Monitoring profile
        run: |
          docker run --rm -v "$PWD/infra/monitoring/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /p/alerts.yml
          docker compose --profile monitoring up -d --wait prometheus grafana
          ./scripts/check-monitoring.sh
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose --profile monitoring down -v
